<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Sunburst rays">
  <defs>
    <g id="ray"><polygon points="400,400 388,0 412,0" fill="#18aaff"/></g>
  </defs>
  <g opacity="0.9">
    <!-- 24 rays at 15deg increments -->
    <use href="#ray" transform="rotate(0 400 400)"/>
    <use href="#ray" transform="rotate(15 400 400)"/>
    <use href="#ray" transform="rotate(30 400 400)"/>
    <use href="#ray" transform="rotate(45 400 400)"/>
    <use href="#ray" transform="rotate(60 400 400)"/>
    <use href="#ray" transform="rotate(75 400 400)"/>
    <use href="#ray" transform="rotate(90 400 400)"/>
    <use href="#ray" transform="rotate(105 400 400)"/>
    <use href="#ray" transform="rotate(120 400 400)"/>
    <use href="#ray" transform="rotate(135 400 400)"/>
    <use href="#ray" transform="rotate(150 400 400)"/>
    <use href="#ray" transform="rotate(165 400 400)"/>
    <use href="#ray" transform="rotate(180 400 400)"/>
    <use href="#ray" transform="rotate(195 400 400)"/>
    <use href="#ray" transform="rotate(210 400 400)"/>
    <use href="#ray" transform="rotate(225 400 400)"/>
    <use href="#ray" transform="rotate(240 400 400)"/>
    <use href="#ray" transform="rotate(255 400 400)"/>
    <use href="#ray" transform="rotate(270 400 400)"/>
    <use href="#ray" transform="rotate(285 400 400)"/>
    <use href="#ray" transform="rotate(300 400 400)"/>
    <use href="#ray" transform="rotate(315 400 400)"/>
    <use href="#ray" transform="rotate(330 400 400)"/>
    <use href="#ray" transform="rotate(345 400 400)"/>
  </g>
</svg>
